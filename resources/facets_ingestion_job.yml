# Runs bronze, then silver (the framework's one-pipeline-per-layer convention).
resources:
  jobs:
    facets_ingestion:
      name: facets_ingestion${var.logical_env}
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.facets_bronze.id}
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.facets_silver.id}
