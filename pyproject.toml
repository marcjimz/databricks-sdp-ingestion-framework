[project]
name = "sdp-ingestion-framework"
version = "0.1.0"
description = "Configuration-driven, multi-source ingestion framework on Lakeflow Spark Declarative Pipelines, deployed with Declarative Automation Bundles."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are deliberately minimal: the same package is imported by the
# SDP pipeline (serverless), the governance/seed jobs, and the bundle resource loader.
dependencies = [
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "databricks-bundles>=1.25.0",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_framework"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "enforcement: durable repo-wide rules that must hold for every source, group, table and environment",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913",  # builders legitimately take several arguments
  "PLR0917",  # ... including positional ones (dp, spark, cfg, group, table)
  "PLR0912",  # dispatchers (preflight checks, value generators) are clearer flat than split
  "PLR2004",  # magic values in tests are fine
  "PLC0415",  # lazy imports are deliberate: Spark-only modules and the config<->contracts cycle
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]
"src/pipelines/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ingestion_framework"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "databricks.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SDP's decorators (dp.append_flow, dp.temporary_view, dp.expect_all) come from the runtime-only
# `pyspark.pipelines` API, which ships no type stubs.
module = ["ingestion_framework.adapters.qlik_cdc_files.runtime"]
disallow_untyped_decorators = false
